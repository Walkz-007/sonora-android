name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash -o pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the Rust engine for arm64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a --platform 26 -o android/app/src/main/jniLibs build --release -p sonora-core 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - name: Generate Kotlin bindings
        run: |
          cargo run -p uniffi-bindgen -- generate \
            --library target/aarch64-linux-android/release/libsonora_core.so \
            --language kotlin --no-format \
            --out-dir android/app/src/main/java 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          find android/app/src/main/java -name '*.kt' -path '*core*'

      - name: Locate the TLS verifier's Android library
        id: rustls
        run: |
          manifest=$(cargo metadata --format-version 1 --filter-platform aarch64-linux-android \
            | jq -r '.packages[] | select(.name == "rustls-platform-verifier-android") | .manifest_path')
          echo "maven=$(dirname "$manifest")/maven" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the APK
        run: |
          gradle -p android assembleRelease --stacktrace \
            -PrustlsMaven="${{ steps.rustls.outputs.maven }}" \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="0.1.${{ github.run_number }}" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          cp android/app/build/outputs/apk/release/app-release.apk sonora-android.apk
          ls -la sonora-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonora-android
          path: sonora-android.apk

      - name: Publish as the latest build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: true
          body: |
            Built from ${{ github.sha }}. Install `sonora-android.apk` on an arm64 Android 8.0+ phone.
          files: sonora-android.apk

      # The run's own logs live behind GitHub's blob storage; a failure also lands on the
      # ci-logs branch, where the log can be read through git.
      - name: Keep the failure log
        if: failure()
        run: |
          log="$RUNNER_TEMP/build.log"
          touch "$log"
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          git init -q -b ci-logs
          grep -n -E "^(error|warning: unused)|error\[|^e: |FAILURE|What went wrong|Exception|undefined reference|cannot find|ld: |ld.lld" "$log" | head -400 > errors.txt || true
          tail -n 1500 "$log" > tail.txt
          echo "${{ github.sha }} run ${{ github.run_id }}" > run.txt
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "logs for ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
